name: Refresh TeslaFi data

on:
  schedule:
    # TEMPORARY TEST: every 5 minutes
    - cron: "*/5 * * * *"

  # Allows manual testing too
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh TeslaFi data
        run: python update.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh TeslaFi firmware status"
          git push