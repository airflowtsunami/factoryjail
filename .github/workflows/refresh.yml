name: Refresh TeslaFi data

on:
  schedule:
    # Run at 7, 27, 47 and 57 minutes past every hour.
    - cron: "7,27,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh TeslaFi data
        run: python refresh_teslafi.py

      - name: Commit updated data
        run: |
          git config user.name "Tesla Firmware Bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh TeslaFi data"
          git push